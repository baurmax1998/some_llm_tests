[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "json-schema-playground"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlx==0.32.4", "mlx-lm==0.32.2", "outlines==1.3.3",
  "outlines-core==0.2.14", "transformers==5.20.2", "numpy==2.3.5",
  "jsonschema==4.25.1", "pydantic==2.14.1", "streamlit==1.66.1"
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
json-schema-playground = "json_schema_playground.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: echter lokaler Lauf mit dem MLX-Modell"]
