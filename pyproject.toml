[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlx==0.32.4",
  "mlx-lm==0.32.2",
  "outlines==1.3.3",
  "outlines-core==0.2.14",
  "transformers==5.20.2",
  "numpy==2.3.5",
  "jsonschema==4.25.1",
  "pydantic==2.14.1",
  "streamlit==1.66.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
sic = "src.cli:main"
snake = "src.games.snake:main"
gamer = "src.games.gamer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.games" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: echter lokaler Lauf mit dem MLX-Modell"]
